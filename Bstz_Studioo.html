<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bstz Studio | مسابقات حرفه‌ای</title>
    <style>
        body {
            background: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #00ff41; /* رنگ نئون سبز */
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #00ff41; margin-bottom: 10px; }
        p { color: #ccc; line-height: 1.6; }
        .price { font-size: 24px; font-weight: bold; color: #fff; margin: 20px 0; }
        
        .btn {
            background: transparent;
            border: 2px solid #00ff41;
            color: #00ff41;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
            display: inline-block;
            margin-top: 10px;
        }
        .btn:hover {
            background: #00ff41;
            color: #000;
            box-shadow: 0 0 20px #00ff41;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bstz Studio</h1>
        <p>به لیگ حرفه‌ای ما خوش آمدید! رقابت داغ ۸ نفره با جوایز ویژه.</p>
        <div class="price">ورودی: ۱۵۰,۰۰۰ تومان</div>
        <p>برای ثبت‌نام و دریافت تاییدیه، رسید پرداخت را به آیدی زیر در <b>روبیکا</b> ارسال کنید:</p>
        <a href="https://rubika.ir/tavanaee56" class="btn">ارسال رسید به روبیکا</a>
    </div>

</body>
</html>

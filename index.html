<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bstz Studio</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin: 5px 0; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .btn-copy { background: #555; color: white; }
        .btn-enter { background: #00ff00; color: #000; }
        textarea { width: 100%; height: 200px; background: #111; color: #0f0; border: 1px solid #333; padding: 10px; font-family: monospace; box-sizing: border-box; }
        #output { background: #222; padding: 10px; margin-top: 10px; border-radius: 5px; color: #fff; min-height: 50px; text-align: left; }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- بخش اول -->
    <h1>Bstz Studio</h1>
    <button class="btn-copy" onclick="copyId()">کپی آیدی (@tavanaee56)</button>
    <br><br>
    <input type="text" id="passcode" placeholder="کد صحیح را وارد کنید">
    <button class="btn-enter" onclick="checkCode()">ورود به برنامه</button>
</div>

<script>
    function copyId() {
        navigator.clipboard.writeText("tavanaee56");
        alert("آیدی کپی شد. در روبیکا به من پیام بده.");
    }

    function checkCode() {
        var code = document.getElementById("passcode").value.trim();
        if(code === "BSTZ2026") {
            // تغییر صفحه به محیط برنامه نویسی
            document.getElementById("app").innerHTML = `
                <h3 style="color: yellow; margin-bottom: 20px;">⚠️ از نتیجه کار خود فیلم بگیر و برای ادمین بفرست</h3>
                <textarea id="editor" placeholder="کد جاوا اسکریپت خود را اینجا بنویسید..."></textarea>
                <button class="btn-enter" onclick="runCode()">اجرای کد</button>
                <div id="output">خروجی:</div>
            `;
        } else {
            alert("کد اشتباه است!");
        }
    }

    function runCode() {
        var code = document.getElementById("editor").value;
        var outputDiv = document.getElementById("output");
        outputDiv.innerHTML = "خروجی:<br>";
        
        try {
            // جایگزین کردن console.log برای نمایش در صفحه
            var log = (msg) => { outputDiv.innerHTML += msg + "<br>"; };
            eval(code.replace(/console\.log/g, "log"));
        } catch(e) {
            outputDiv.innerHTML += "<span style='color:red;'>خطا: " + e.message + "</span>";
        }
    }
</script>

</body>
</html>

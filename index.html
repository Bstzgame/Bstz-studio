<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>BSTZ Studio | استودیو بازی‌سازی من</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .header { background-color: #2c3e50; color: white; padding: 20px; text-align: center; border-radius: 10px; }
        .header h1 { margin: 0; }
        .header p { margin: 5px 0 0 0; color: #3498db; font-weight: bold; }
        .container { max-width: 700px; margin: 20px auto; }
        .card { background-color: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        textarea { width: 100%; height: 150px; margin-top: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-family: monospace; }
        button { background-color: #27ae60; color: white; border: none; padding: 10px 20px; margin-top: 10px; cursor: pointer; border-radius: 5px; width: 100%; }
        iframe { width: 100%; height: 200px; border: 2px solid #3498db; margin-top: 10px; border-radius: 5px; background: white; }
    </style>
</head>
<body>

    <div class="header">
        <h1>به استودیوی بازی‌سازی BSTZ خوش آمدید</h1>
        <p>bstz-studio.ir</p>
    </div>

    <div class="container">
        <!-- بخش پروژه و ویرایشگر -->
        <div class="card">
            <h2>پروژه من (ویرایشگر زنده)</h2>
            <p>کد HTML خود را اینجا بنویس و دکمه اجرا را بزن:</p>
            <textarea id="myCode" placeholder="<h1>سلام! این پروژه جدید من است</h1>"></textarea>
            <button onclick="runCode()">اجرای کد</button>
            <iframe id="previewWindow"></iframe>
        </div>

        <div class="card">
            <h2>درباره من</h2>
            <p>برنامه‌نویس و عاشق بازی‌سازی در محیط اندروید. اینجا محل ثبت پروژه‌های من است.</p>
        </div>
    </div>

    <script>
        function runCode() {
            let code = document.getElementById('myCode').value;
            let preview = document.getElementById('previewWindow');
            preview.srcdoc = code;
        }
    </script>

</body>
</html>
